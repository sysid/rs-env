[tool.bumpversion]
current_version = "7.0.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(-(?P<pre>alpha|beta|rc)\\.(?P<prenum>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{pre}.{prenum}",
    "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[tool.bumpversion.parts.pre]
optional_value = "release"
values = ["alpha", "beta", "rc", "release"]

[[tool.bumpversion.files]]
filename = "VERSION"

[[tool.bumpversion.files]]
filename = "./rsenv/Cargo.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# Without this the bump commit leaves Cargo.lock stale: `cargo publish` refuses the dirty
# tree and `cargo build --locked` fails on the tag. The name line keeps the match on rsenv.
[[tool.bumpversion.files]]
filename = "./rsenv/Cargo.lock"
search = """
name = "rsenv"
version = "{current_version}"
"""
replace = """
name = "rsenv"
version = "{new_version}"
"""
regex = false
