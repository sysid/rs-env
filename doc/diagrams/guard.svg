<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="t d">
  <title id="t">Guarding a file</title>
  <desc id="d">Before, git tracks the real secrets file. rsenv guard add moves it into the vault&#x27;s guarded directory and leaves a symlink in the project, so git only tracks the symlink.</desc>
  <style>
    :root {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --row: #f6f8fa;
      --proj: #0969da; --proj-bg: #ddf4ff; --proj-line: #54aeff;
      --vault: #8250df; --vault-bg: #fbefff; --vault-line: #c297ff;
      --ok: #1a7f37; --ok-bg: #dafbe1; --ok-line: #4ac26b;
      --warn: #9a6700; --warn-bg: #fff8c5; --warn-line: #d4a72c;
      --bad: #cf222e; --bad-bg: #ffebe9; --bad-line: #ff8182;
      --link: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --row: #161b22;
        --proj: #4493f8; --proj-bg: #0c2d6b; --proj-line: #1f6feb;
        --vault: #ab7df8; --vault-bg: #271052; --vault-line: #8957e5;
        --ok: #3fb950; --ok-bg: #033a16; --ok-line: #238636;
        --warn: #d29922; --warn-bg: #3b2300; --warn-line: #9e6a03;
        --bad: #f85149; --bad-bg: #490202; --bad-line: #da3633;
        --link: #f778ba;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 17px; font-weight: 600; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--muted); }
    .note { font-size: 12px; fill: var(--muted); }
    .strong { font-weight: 600; }
    .bg { fill: var(--bg); }
    .row { fill: var(--row); }
    .proj { fill: var(--proj-bg); stroke: var(--proj-line); stroke-width: 1.5; }
    .vault { fill: var(--vault-bg); stroke: var(--vault-line); stroke-width: 1.5; }
    .ok { fill: var(--ok-bg); stroke: var(--ok-line); stroke-width: 1.5; }
    .warn { fill: var(--warn-bg); stroke: var(--warn-line); stroke-width: 1.5; }
    .bad { fill: var(--bad-bg); stroke: var(--bad-line); stroke-width: 1.5; }
    .ink-proj { fill: var(--proj); } .ink-vault { fill: var(--vault); } .ink-ok { fill: var(--ok); }
    .ink-warn { fill: var(--warn); } .ink-bad { fill: var(--bad); } .ink-link { fill: var(--link); }
    .ink-muted { fill: var(--muted); }
    .line { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .arrow { stroke: var(--link); stroke-width: 2.5; fill: none; }
    .arrow-proj { stroke: var(--proj); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow-vault { stroke: var(--vault); stroke-width: 2; fill: none; }
    .head { fill: var(--link); } .head-proj { fill: var(--proj); } .head-vault { fill: var(--vault); }
    .head-muted { fill: var(--muted); }
    .pill { fill: var(--bg); stroke: var(--link); stroke-width: 1.5; }
    .pill-text { font-size: 13px; font-weight: 600; fill: var(--link); }
    .strike { text-decoration: line-through; }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="270" rx="12"/>
  <rect class="bad" x="24" y="24" width="250" height="170" rx="14"/>
  <text class="title ink-bad" x="44" y="56" text-anchor="start">Before</text>
  <text class="path" x="44" y="76" text-anchor="start">project/</text>
  <rect class="row" x="44" y="84" width="210" height="44" rx="8"/>
  <text class="mono" x="58" y="103" text-anchor="start" style="font-size: 13px">config/secrets.yaml</text>
  <text class="note" x="58" y="120" text-anchor="start">real file</text>
  <text class="note strong ink-bad" x="44" y="166" text-anchor="start">git tracks the secret</text>
  <rect class="ok" x="334" y="24" width="250" height="170" rx="14"/>
  <text class="title ink-ok" x="354" y="56" text-anchor="start">After</text>
  <text class="path" x="354" y="76" text-anchor="start">project/</text>
  <rect class="warn" x="354" y="84" width="210" height="44" rx="8"/>
  <text class="mono" x="368" y="103" text-anchor="start" style="font-size: 13px">config/secrets.yaml</text>
  <text class="note" x="368" y="120" text-anchor="start">symlink</text>
  <text class="note strong ink-ok" x="354" y="166" text-anchor="start">git tracks a harmless symlink</text>
  <rect class="vault" x="606" y="24" width="250" height="170" rx="14"/>
  <text class="title ink-vault" x="626" y="56" text-anchor="start">Vault</text>
  <text class="path" x="626" y="76" text-anchor="start">vault/guarded/</text>
  <rect class="row" x="626" y="84" width="210" height="44" rx="8"/>
  <text class="mono" x="640" y="103" text-anchor="start" style="font-size: 13px">config/secrets.yaml</text>
  <text class="note" x="640" y="120" text-anchor="start">real file</text>
  <text class="note strong ink-vault" x="626" y="166" text-anchor="start">safe, outside git</text>
  <path class="arrow" d="M274 106 L 323.0 106.0"/>
  <path class="head" d="M334 106 L 323.2 111.2 L 323.2 100.8 z"/>
  <path class="arrow" d="M564 106 L 615.0 106.0"/>
  <path class="head" d="M626 106 L 615.2 111.2 L 615.2 100.8 z"/>
  <path class="line" d="M304 222 V 112" style="stroke-dasharray: 3 3"/>
  <rect class="pill" x="165.25" y="222" width="277.5" height="28" rx="14"/>
  <text class="pill-text" x="304" y="241" text-anchor="middle">rsenv guard add config/secrets.yaml</text>
</svg>
