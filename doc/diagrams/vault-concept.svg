<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d">
  <title id="t">The vault concept</title>
  <desc id="d">The project&#x27;s .envrc is a symlink to dot.envrc in the vault. dot.envrc exports RSENV_VAULT, which points from the shell back to the vault root.</desc>
  <style>
    :root {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --row: #f6f8fa;
      --proj: #0969da; --proj-bg: #ddf4ff; --proj-line: #54aeff;
      --vault: #8250df; --vault-bg: #fbefff; --vault-line: #c297ff;
      --ok: #1a7f37; --ok-bg: #dafbe1; --ok-line: #4ac26b;
      --warn: #9a6700; --warn-bg: #fff8c5; --warn-line: #d4a72c;
      --bad: #cf222e; --bad-bg: #ffebe9; --bad-line: #ff8182;
      --link: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --row: #161b22;
        --proj: #4493f8; --proj-bg: #0c2d6b; --proj-line: #1f6feb;
        --vault: #ab7df8; --vault-bg: #271052; --vault-line: #8957e5;
        --ok: #3fb950; --ok-bg: #033a16; --ok-line: #238636;
        --warn: #d29922; --warn-bg: #3b2300; --warn-line: #9e6a03;
        --bad: #f85149; --bad-bg: #490202; --bad-line: #da3633;
        --link: #f778ba;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 17px; font-weight: 600; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--muted); }
    .note { font-size: 12px; fill: var(--muted); }
    .strong { font-weight: 600; }
    .bg { fill: var(--bg); }
    .row { fill: var(--row); }
    .proj { fill: var(--proj-bg); stroke: var(--proj-line); stroke-width: 1.5; }
    .vault { fill: var(--vault-bg); stroke: var(--vault-line); stroke-width: 1.5; }
    .ok { fill: var(--ok-bg); stroke: var(--ok-line); stroke-width: 1.5; }
    .warn { fill: var(--warn-bg); stroke: var(--warn-line); stroke-width: 1.5; }
    .bad { fill: var(--bad-bg); stroke: var(--bad-line); stroke-width: 1.5; }
    .ink-proj { fill: var(--proj); } .ink-vault { fill: var(--vault); } .ink-ok { fill: var(--ok); }
    .ink-warn { fill: var(--warn); } .ink-bad { fill: var(--bad); } .ink-link { fill: var(--link); }
    .ink-muted { fill: var(--muted); }
    .line { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .arrow { stroke: var(--link); stroke-width: 2.5; fill: none; }
    .arrow-proj { stroke: var(--proj); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow-vault { stroke: var(--vault); stroke-width: 2; fill: none; }
    .head { fill: var(--link); } .head-proj { fill: var(--proj); } .head-vault { fill: var(--vault); }
    .head-muted { fill: var(--muted); }
    .pill { fill: var(--bg); stroke: var(--link); stroke-width: 1.5; }
    .pill-text { font-size: 13px; font-weight: 600; fill: var(--link); }
    .strike { text-decoration: line-through; }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="320" rx="12"/>
  <rect class="proj" x="24" y="24" width="280" height="236" rx="14"/>
  <text class="title ink-proj" x="44" y="56" text-anchor="start">Your project</text>
  <text class="path" x="44" y="76" text-anchor="start">git-tracked</text>
  <rect class="warn" x="44" y="96" width="240" height="34" rx="8"/>
  <text class="mono " x="58" y="118.04" text-anchor="start" style="font-size: 14px">.envrc</text>
  <text class="note" x="270" y="117.0" text-anchor="end">symlink</text>
  <text class="note" x="44" y="160" text-anchor="start">your shell, after direnv loads it:</text>
  <rect class="row" x="44" y="172" width="240" height="30" rx="8"/>
  <text class="mono " x="58" y="191.68" text-anchor="start" style="font-size: 13px">RSENV_VAULT=…</text>
  <rect class="vault" x="536" y="24" width="320" height="236" rx="14"/>
  <text class="title ink-vault" x="556" y="56" text-anchor="start">Vault root</text>
  <text class="path" x="556" y="76" text-anchor="start">~/.rsenv/vaults/myproject-a1b2c3d4/</text>
  <rect x="765.0" y="40" width="75.0" height="22" rx="11" style="fill: var(--vault)"/>
  <text class="strong" x="802.5" y="55" text-anchor="middle" style="font-size: 11px; fill: var(--bg)">not in git</text>
  <rect class="row" x="556" y="80" width="280" height="160" rx="10"/>
  <text class="mono strong" x="572" y="104" text-anchor="start" style="font-size: 14px">dot.envrc</text>
  <text class="mono ink-muted" x="572" y="130" text-anchor="start" style="font-size: 12px"># rsenv section (managed)</text>
  <text class="mono ink-vault" x="572" y="150" text-anchor="start" style="font-size: 12px">export RSENV_VAULT=…</text>
  <text class="mono ink-muted" x="572" y="176" text-anchor="start" style="font-size: 12px"># your original .envrc,</text>
  <text class="mono ink-muted" x="572" y="194" text-anchor="start" style="font-size: 12px"># kept as it was</text>
  <path class="arrow" d="M284 113 L 545.0 104.4"/>
  <path class="head" d="M556 104 L 545.4 109.6 L 545.0 99.1 z"/>
  <rect class="pill" x="383.45" y="72" width="73.1" height="28" rx="14"/>
  <text class="pill-text" x="420" y="91" text-anchor="middle">symlink</text>
  <path class="arrow-proj" d="M284 189 Q 414.5 215.1 545.1 161.2"/>
  <path class="head-proj" d="M556 160 L 545.8 166.3 L 544.7 156.0 z"/>
  <text class="note strong ink-proj" x="420" y="220" text-anchor="middle">RSENV_VAULT points back to the vault</text>
  <text class="note" x="440" y="296" text-anchor="middle">One link, both directions: the symlink finds the vault&#x27;s .envrc, RSENV_VAULT tells rsenv where the vault is.</text>
</svg>
