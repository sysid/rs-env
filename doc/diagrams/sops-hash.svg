<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 284" width="880" height="284" role="img" aria-labelledby="t d">
  <title id="t">Content-addressed encryption</title>
  <desc id="d">Encrypting secrets.env writes secrets.env.a1b2c3d4.enc, where a1b2c3d4 is a SHA-256 prefix of the plaintext. Editing the plaintext changes the hash, status reports stale, and re-encrypting writes a new name.</desc>
  <style>
    :root {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --row: #f6f8fa;
      --proj: #0969da; --proj-bg: #ddf4ff; --proj-line: #54aeff;
      --vault: #8250df; --vault-bg: #fbefff; --vault-line: #c297ff;
      --ok: #1a7f37; --ok-bg: #dafbe1; --ok-line: #4ac26b;
      --warn: #9a6700; --warn-bg: #fff8c5; --warn-line: #d4a72c;
      --bad: #cf222e; --bad-bg: #ffebe9; --bad-line: #ff8182;
      --link: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --row: #161b22;
        --proj: #4493f8; --proj-bg: #0c2d6b; --proj-line: #1f6feb;
        --vault: #ab7df8; --vault-bg: #271052; --vault-line: #8957e5;
        --ok: #3fb950; --ok-bg: #033a16; --ok-line: #238636;
        --warn: #d29922; --warn-bg: #3b2300; --warn-line: #9e6a03;
        --bad: #f85149; --bad-bg: #490202; --bad-line: #da3633;
        --link: #f778ba;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 17px; font-weight: 600; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--muted); }
    .note { font-size: 12px; fill: var(--muted); }
    .strong { font-weight: 600; }
    .bg { fill: var(--bg); }
    .row { fill: var(--row); }
    .proj { fill: var(--proj-bg); stroke: var(--proj-line); stroke-width: 1.5; }
    .vault { fill: var(--vault-bg); stroke: var(--vault-line); stroke-width: 1.5; }
    .ok { fill: var(--ok-bg); stroke: var(--ok-line); stroke-width: 1.5; }
    .warn { fill: var(--warn-bg); stroke: var(--warn-line); stroke-width: 1.5; }
    .bad { fill: var(--bad-bg); stroke: var(--bad-line); stroke-width: 1.5; }
    .ink-proj { fill: var(--proj); } .ink-vault { fill: var(--vault); } .ink-ok { fill: var(--ok); }
    .ink-warn { fill: var(--warn); } .ink-bad { fill: var(--bad); } .ink-link { fill: var(--link); }
    .ink-muted { fill: var(--muted); }
    .line { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .arrow { stroke: var(--link); stroke-width: 2.5; fill: none; }
    .arrow-proj { stroke: var(--proj); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow-vault { stroke: var(--vault); stroke-width: 2; fill: none; }
    .head { fill: var(--link); } .head-proj { fill: var(--proj); } .head-vault { fill: var(--vault); }
    .head-muted { fill: var(--muted); }
    .pill { fill: var(--bg); stroke: var(--link); stroke-width: 1.5; }
    .pill-text { font-size: 13px; font-weight: 600; fill: var(--link); }
    .strike { text-decoration: line-through; }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="284" rx="12"/>
  <rect class="proj" x="24" y="40" width="170" height="40" rx="8"/>
  <text class="mono " x="38" y="65.04" text-anchor="start" style="font-size: 14px">secrets.env</text>
  <path class="arrow" d="M194 60 L 319.0 60.0"/>
  <path class="head" d="M330 60 L 319.2 65.2 L 319.2 54.8 z"/>
  <rect class="pill" x="225.45" y="24" width="73.1" height="28" rx="14"/>
  <text class="pill-text" x="262" y="43" text-anchor="middle">encrypt</text>
  <rect class="ok" x="330" y="40" width="290" height="40" rx="8"/>
  <text class="mono" x="346" y="66" text-anchor="start" style="font-size: 15px">secrets.env.</text>
  <text class="mono strong ink-link" x="453" y="66" text-anchor="start" style="font-size: 15px">a1b2c3d4</text>
  <text class="mono" x="526" y="66" text-anchor="start" style="font-size: 15px">.enc</text>
  <path class="line" d="M455 86 v 8 h 72 v -8"/>
  <text class="note" x="491" y="112" text-anchor="middle">first 8 hex of SHA-256(plaintext)</text>
  <rect class="warn" x="24" y="160" width="170" height="40" rx="8"/>
  <text class="mono " x="38" y="185.04" text-anchor="start" style="font-size: 14px">secrets.env</text>
  <text class="note" x="180" y="184.0" text-anchor="end">edited</text>
  <path class="arrow" d="M194 180 L 289.0 180.0"/>
  <path class="head" d="M300 180 L 289.2 185.2 L 289.2 174.8 z"/>
  <rect class="warn" x="300" y="162" width="150" height="36" rx="18"/>
  <text class="strong ink-warn" x="375" y="185" text-anchor="middle">status: stale</text>
  <path class="arrow" d="M450 180 L 549.0 180.0"/>
  <path class="head" d="M560 180 L 549.2 185.2 L 549.2 174.8 z"/>
  <rect class="pill" x="457.5" y="144" width="95.0" height="28" rx="14"/>
  <text class="pill-text" x="505" y="163" text-anchor="middle">re-encrypt</text>
  <rect class="ok" x="560" y="160" width="296" height="40" rx="8"/>
  <text class="mono" x="576" y="186" text-anchor="start" style="font-size: 15px">secrets.env.</text>
  <text class="mono strong ink-link" x="683" y="186" text-anchor="start" style="font-size: 15px">f9e8d7c6</text>
  <text class="mono" x="756" y="186" text-anchor="start" style="font-size: 15px">.enc</text>
  <text class="note strike" x="708" y="222" text-anchor="middle">secrets.env.a1b2c3d4.enc is removed</text>
  <text class="note" x="24" y="262" text-anchor="start">The hash in the name is the staleness check: no key is needed to see that a ciphertext is out of date.</text>
</svg>
