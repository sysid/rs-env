<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" aria-labelledby="t d">
  <title id="t">Building an environment</title>
  <desc id="d">rsenv env build prod.env follows prod.env to cloud.env to base.env and merges them; the nearest file wins: DB_HOST from cloud.env, DB_PORT from base.env, LOG_LEVEL from prod.env.</desc>
  <style>
    :root {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --row: #f6f8fa;
      --proj: #0969da; --proj-bg: #ddf4ff; --proj-line: #54aeff;
      --vault: #8250df; --vault-bg: #fbefff; --vault-line: #c297ff;
      --ok: #1a7f37; --ok-bg: #dafbe1; --ok-line: #4ac26b;
      --warn: #9a6700; --warn-bg: #fff8c5; --warn-line: #d4a72c;
      --bad: #cf222e; --bad-bg: #ffebe9; --bad-line: #ff8182;
      --link: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --row: #161b22;
        --proj: #4493f8; --proj-bg: #0c2d6b; --proj-line: #1f6feb;
        --vault: #ab7df8; --vault-bg: #271052; --vault-line: #8957e5;
        --ok: #3fb950; --ok-bg: #033a16; --ok-line: #238636;
        --warn: #d29922; --warn-bg: #3b2300; --warn-line: #9e6a03;
        --bad: #f85149; --bad-bg: #490202; --bad-line: #da3633;
        --link: #f778ba;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 17px; font-weight: 600; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--muted); }
    .note { font-size: 12px; fill: var(--muted); }
    .strong { font-weight: 600; }
    .bg { fill: var(--bg); }
    .row { fill: var(--row); }
    .proj { fill: var(--proj-bg); stroke: var(--proj-line); stroke-width: 1.5; }
    .vault { fill: var(--vault-bg); stroke: var(--vault-line); stroke-width: 1.5; }
    .ok { fill: var(--ok-bg); stroke: var(--ok-line); stroke-width: 1.5; }
    .warn { fill: var(--warn-bg); stroke: var(--warn-line); stroke-width: 1.5; }
    .bad { fill: var(--bad-bg); stroke: var(--bad-line); stroke-width: 1.5; }
    .ink-proj { fill: var(--proj); } .ink-vault { fill: var(--vault); } .ink-ok { fill: var(--ok); }
    .ink-warn { fill: var(--warn); } .ink-bad { fill: var(--bad); } .ink-link { fill: var(--link); }
    .ink-muted { fill: var(--muted); }
    .line { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .arrow { stroke: var(--link); stroke-width: 2.5; fill: none; }
    .arrow-proj { stroke: var(--proj); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow-vault { stroke: var(--vault); stroke-width: 2; fill: none; }
    .head { fill: var(--link); } .head-proj { fill: var(--proj); } .head-vault { fill: var(--vault); }
    .head-muted { fill: var(--muted); }
    .pill { fill: var(--bg); stroke: var(--link); stroke-width: 1.5; }
    .pill-text { font-size: 13px; font-weight: 600; fill: var(--link); }
    .strike { text-decoration: line-through; }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="270" rx="12"/>
  <text class="mono strong" x="24" y="40" text-anchor="start" style="font-size: 15px">rsenv env build prod.env</text>
  <rect class="proj" x="24" y="64" width="170" height="42" rx="10"/>
  <text class="mono strong ink-proj" x="109" y="90" text-anchor="middle" style="font-size: 14px">prod.env</text>
  <path class="line" d="M109 106 L 109.0 123.0"/>
  <path class="head-muted" d="M109 134 L 103.8 123.2 L 114.2 123.2 z"/>
  <text class="note" x="122" y="124" text-anchor="start">inherits</text>
  <rect class="proj" x="24" y="134" width="170" height="42" rx="10"/>
  <text class="mono strong ink-proj" x="109" y="160" text-anchor="middle" style="font-size: 14px">cloud.env</text>
  <path class="line" d="M109 176 L 109.0 193.0"/>
  <path class="head-muted" d="M109 204 L 103.8 193.2 L 114.2 193.2 z"/>
  <text class="note" x="122" y="194" text-anchor="start">inherits</text>
  <rect class="vault" x="24" y="204" width="170" height="42" rx="10"/>
  <text class="mono strong ink-vault" x="109" y="230" text-anchor="middle" style="font-size: 14px">base.env</text>
  <path class="arrow" d="M214 140 L 319.0 140.0"/>
  <path class="head" d="M330 140 L 319.2 145.2 L 319.2 134.8 z"/>
  <rect class="pill" x="242.75" y="102" width="58.5" height="28" rx="14"/>
  <text class="pill-text" x="272" y="121" text-anchor="middle">merge</text>
  <rect class="ok" x="340" y="56" width="516" height="190" rx="14"/>
  <text class="title ink-ok" x="360" y="88" text-anchor="start">Merged output</text>
  <text class="path" x="360" y="108" text-anchor="start">child wins</text>
  <rect class="row" x="360" y="120" width="476" height="30" rx="8"/>
  <text class="mono " x="374" y="139.68" text-anchor="start" style="font-size: 13px">export DB_HOST=rds.aws.com</text>
  <rect class="proj" x="726" y="125" width="96" height="20" rx="10"/>
  <text class="mono ink-proj" x="774" y="139" text-anchor="middle" style="font-size: 11px">cloud.env</text>
  <rect class="row" x="360" y="158" width="476" height="30" rx="8"/>
  <text class="mono " x="374" y="177.68" text-anchor="start" style="font-size: 13px">export DB_PORT=5432</text>
  <rect class="vault" x="726" y="163" width="96" height="20" rx="10"/>
  <text class="mono ink-vault" x="774" y="177" text-anchor="middle" style="font-size: 11px">base.env</text>
  <rect class="row" x="360" y="196" width="476" height="30" rx="8"/>
  <text class="mono " x="374" y="215.68" text-anchor="start" style="font-size: 13px">export LOG_LEVEL=error</text>
  <rect class="proj" x="726" y="201" width="96" height="20" rx="10"/>
  <text class="mono ink-proj" x="774" y="215" text-anchor="middle" style="font-size: 11px">prod.env</text>
</svg>
