<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 504" width="880" height="504" role="img" aria-labelledby="t d">
  <title id="t">Environment hierarchy</title>
  <desc id="d">base.env is the root. local.env, test.env and cloud.env name base.env as parent; staging.env and prod.env name cloud.env. cloud.env overrides DB_HOST, prod.env overrides LOG_LEVEL.</desc>
  <style>
    :root {
      --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --row: #f6f8fa;
      --proj: #0969da; --proj-bg: #ddf4ff; --proj-line: #54aeff;
      --vault: #8250df; --vault-bg: #fbefff; --vault-line: #c297ff;
      --ok: #1a7f37; --ok-bg: #dafbe1; --ok-line: #4ac26b;
      --warn: #9a6700; --warn-bg: #fff8c5; --warn-line: #d4a72c;
      --bad: #cf222e; --bad-bg: #ffebe9; --bad-line: #ff8182;
      --link: #bf3989;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --ink: #e6edf3; --muted: #9198a1; --row: #161b22;
        --proj: #4493f8; --proj-bg: #0c2d6b; --proj-line: #1f6feb;
        --vault: #ab7df8; --vault-bg: #271052; --vault-line: #8957e5;
        --ok: #3fb950; --ok-bg: #033a16; --ok-line: #238636;
        --warn: #d29922; --warn-bg: #3b2300; --warn-line: #9e6a03;
        --bad: #f85149; --bad-bg: #490202; --bad-line: #da3633;
        --link: #f778ba;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-size: 17px; font-weight: 600; }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--muted); }
    .note { font-size: 12px; fill: var(--muted); }
    .strong { font-weight: 600; }
    .bg { fill: var(--bg); }
    .row { fill: var(--row); }
    .proj { fill: var(--proj-bg); stroke: var(--proj-line); stroke-width: 1.5; }
    .vault { fill: var(--vault-bg); stroke: var(--vault-line); stroke-width: 1.5; }
    .ok { fill: var(--ok-bg); stroke: var(--ok-line); stroke-width: 1.5; }
    .warn { fill: var(--warn-bg); stroke: var(--warn-line); stroke-width: 1.5; }
    .bad { fill: var(--bad-bg); stroke: var(--bad-line); stroke-width: 1.5; }
    .ink-proj { fill: var(--proj); } .ink-vault { fill: var(--vault); } .ink-ok { fill: var(--ok); }
    .ink-warn { fill: var(--warn); } .ink-bad { fill: var(--bad); } .ink-link { fill: var(--link); }
    .ink-muted { fill: var(--muted); }
    .line { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .arrow { stroke: var(--link); stroke-width: 2.5; fill: none; }
    .arrow-proj { stroke: var(--proj); stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .arrow-vault { stroke: var(--vault); stroke-width: 2; fill: none; }
    .head { fill: var(--link); } .head-proj { fill: var(--proj); } .head-vault { fill: var(--vault); }
    .head-muted { fill: var(--muted); }
    .pill { fill: var(--bg); stroke: var(--link); stroke-width: 1.5; }
    .pill-text { font-size: 13px; font-weight: 600; fill: var(--link); }
    .strike { text-decoration: line-through; }
  </style>
  <rect class="bg" x="0" y="0" width="880" height="504" rx="12"/>
  <path class="line" d="M450.0 130 C 450.0 170, 125.0 150, 125.0 182"/>
  <path class="head-muted" d="M125.0 190 l -5 -9 h 10 z"/>
  <path class="line" d="M450.0 130 C 450.0 170, 300.0 150, 300.0 182"/>
  <path class="head-muted" d="M300.0 190 l -5 -9 h 10 z"/>
  <path class="line" d="M450.0 130 C 450.0 170, 615.0 150, 615.0 182"/>
  <path class="head-muted" d="M615.0 190 l -5 -9 h 10 z"/>
  <path class="line" d="M615.0 276 C 615.0 316, 515.0 300, 515.0 332"/>
  <path class="head-muted" d="M515.0 340 l -5 -9 h 10 z"/>
  <path class="line" d="M615.0 276 C 615.0 316, 725.0 300, 725.0 332"/>
  <path class="head-muted" d="M725.0 340 l -5 -9 h 10 z"/>
  <rect class="vault" x="365" y="24" width="170" height="106" rx="10"/>
  <text class="mono strong ink-vault" x="379" y="50" text-anchor="start" style="font-size: 14px">base.env</text>
  <text class="mono" x="379" y="72" text-anchor="start" style="font-size: 12px">DB_HOST=localhost</text>
  <text class="mono" x="379" y="92" text-anchor="start" style="font-size: 12px">DB_PORT=5432</text>
  <text class="mono" x="379" y="112" text-anchor="start" style="font-size: 12px">LOG_LEVEL=info</text>
  <rect class="proj" x="40" y="190" width="170" height="86" rx="10"/>
  <text class="mono strong ink-proj" x="54" y="216" text-anchor="start" style="font-size: 14px">local.env</text>
  <text class="mono ink-muted" x="54" y="238" text-anchor="start" style="font-size: 12px"># rsenv: base.env</text>
  <text class="mono ink-muted" x="54" y="258" text-anchor="start" style="font-size: 12px"># local dev</text>
  <rect class="proj" x="215" y="190" width="170" height="86" rx="10"/>
  <text class="mono strong ink-proj" x="229" y="216" text-anchor="start" style="font-size: 14px">test.env</text>
  <text class="mono ink-muted" x="229" y="238" text-anchor="start" style="font-size: 12px"># rsenv: base.env</text>
  <text class="mono ink-muted" x="229" y="258" text-anchor="start" style="font-size: 12px"># testing</text>
  <rect class="proj" x="530" y="190" width="170" height="86" rx="10"/>
  <text class="mono strong ink-proj" x="544" y="216" text-anchor="start" style="font-size: 14px">cloud.env</text>
  <text class="mono ink-muted" x="544" y="238" text-anchor="start" style="font-size: 12px"># rsenv: base.env</text>
  <text class="mono ink-bad strong" x="544" y="258" text-anchor="start" style="font-size: 12px">DB_HOST=rds.aws.com</text>
  <rect class="proj" x="430" y="340" width="170" height="86" rx="10"/>
  <text class="mono strong ink-proj" x="444" y="366" text-anchor="start" style="font-size: 14px">staging.env</text>
  <text class="mono ink-muted" x="444" y="388" text-anchor="start" style="font-size: 12px"># rsenv: cloud.env</text>
  <text class="mono ink-muted" x="444" y="408" text-anchor="start" style="font-size: 12px"># staging</text>
  <rect class="proj" x="640" y="340" width="170" height="86" rx="10"/>
  <text class="mono strong ink-proj" x="654" y="366" text-anchor="start" style="font-size: 14px">prod.env</text>
  <text class="mono ink-muted" x="654" y="388" text-anchor="start" style="font-size: 12px"># rsenv: cloud.env</text>
  <text class="mono ink-bad strong" x="654" y="408" text-anchor="start" style="font-size: 12px">LOG_LEVEL=error</text>
  <text class="note" x="24" y="470" text-anchor="start">first line # rsenv: parent.env links a child to its parent;</text>
  <text class="note ink-bad" x="24" y="488" text-anchor="start">red values override what the parent set</text>
</svg>
